name: Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example fork-2026-04-15
        required: true
        type: string
      name:
        description: Release title shown on GitHub
        required: true
        type: string
      prerelease:
        description: Mark release as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  QT_VERSION: 6.10.1
  QT_MODULES: qtremoteobjects qt5compat qtimageformats qtshadertools
  ANDROID_BUILD_PLATFORM: android-36

jobs:
  build-windows:
    name: Build Windows Unpacked
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          setup-python: true
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*

      - name: Configure
        shell: powershell
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="${env:RUNNER_TEMP}\Qt\${env:QT_VERSION}\msvc2022_64"

      - name: Build client and service
        shell: powershell
        run: >
          cmake
          --build build
          --config Release
          --target AmneziaVPN AmneziaVPN-service
          --
          /m

      - name: Assemble unpacked bundle
        shell: powershell
        run: |
          $qtRoot = Join-Path $env:RUNNER_TEMP "Qt\${env:QT_VERSION}\msvc2022_64"
          $out = Join-Path $pwd "release\windows-unpacked"
          if (Test-Path $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          Copy-Item '.\build\client\Release\AmneziaVPN.exe' $out
          Copy-Item '.\build\service\server\Release\AmneziaVPN-service.exe' $out
          Copy-Item '.\client\images\app.ico' (Join-Path $out 'AmneziaVPN.ico')

          & (Join-Path $qtRoot 'bin\windeployqt.exe') --release --qmldir '.\client' --force --no-translations --force-openssl (Join-Path $out 'AmneziaVPN.exe')
          & (Join-Path $qtRoot 'bin\windeployqt.exe') --release (Join-Path $out 'AmneziaVPN-service.exe')

          Copy-Item '.\deploy\data\windows\x64\*' $out -Recurse -Force
          Copy-Item '.\client\3rd-prebuilt\deploy-prebuilt\windows\x64\*' $out -Recurse -Force

      - name: Pack zip
        shell: powershell
        run: |
          $zip = Join-Path $pwd 'release\AmneziaVPN_windows_unpacked.zip'
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path '.\release\windows-unpacked\*' -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked
          path: release/AmneziaVPN_windows_unpacked.zip
          compression-level: 0

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: ==0.22.*

      - name: Install android Qt arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: ==0.22.*

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-33" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug apk
        env:
          QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x "${QT_HOST_PATH}/../android_arm64_v8a/bin/qt-cmake"
          chmod +x ./deploy/build_android.sh
          ./deploy/build_android.sh --debug --apk arm64-v8a --move --build-platform "${ANDROID_BUILD_PLATFORM}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: deploy/build/AmneziaVPN-arm64-v8a-debug.apk
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare file list
        run: find release-assets -type f -maxdepth 3 | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/windows-unpacked/AmneziaVPN_windows_unpacked.zip
            release-assets/android-arm64-debug/AmneziaVPN-arm64-v8a-debug.apk
