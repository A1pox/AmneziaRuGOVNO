name: Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example fork-2026-04-15
        required: true
        type: string
      name:
        description: Release title shown on GitHub
        required: true
        type: string
      prerelease:
        description: Mark release as prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  QT_VERSION: 6.10.1
  QIF_VERSION: 4.7
  BUILD_ARCH: 64
  QT_MODULES: qtremoteobjects qt5compat qtimageformats qtshadertools
  ANDROID_BUILD_PLATFORM: android-36

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          setup-python: true
          tools: tools_ifw
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*

      - name: Setup msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          wix extension list -g
          $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer and unpacked bundle
        shell: cmd
        run: |
          set BUILD_ARCH=${{ env.BUILD_ARCH }}
          set QT_BIN_DIR="${{ runner.temp }}\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin"
          set QIF_BIN_DIR="${{ runner.temp }}\Qt\Tools\QtInstallerFramework\${{ env.QIF_VERSION }}\bin"
          set WIX_BIN_DIR=%USERPROFILE%\.dotnet\tools
          set SIGN_WINDOWS_BINARIES=0
          call deploy\build_windows.bat

      - name: Prepare release assets
        shell: powershell
        run: |
          $releaseRoot = Join-Path $pwd 'release'
          if (Test-Path $releaseRoot) { Remove-Item -LiteralPath $releaseRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null

          Copy-Item '.\AmneziaVPN_x64.exe' (Join-Path $releaseRoot 'AmneziaVPN_windows_installer_x64.exe')
          Copy-Item '.\AmneziaVPN_x64.msi' (Join-Path $releaseRoot 'AmneziaVPN_windows_installer_x64.msi')

          $zip = Join-Path $releaseRoot 'AmneziaVPN_windows_unpacked.zip'
          Compress-Archive -Path '.\deploy\build_64\client\release\*' -DestinationPath $zip

      - name: Upload installer exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-exe
          path: release/AmneziaVPN_windows_installer_x64.exe
          compression-level: 0

      - name: Upload installer msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-msi
          path: release/AmneziaVPN_windows_installer_x64.msi
          compression-level: 0

      - name: Upload unpacked zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked
          path: release/AmneziaVPN_windows_unpacked.zip
          compression-level: 0

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: ==0.22.*

      - name: Install android Qt arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: ==0.22.*

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-33" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug apk
        env:
          QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x "${QT_HOST_PATH}/../android_arm64_v8a/bin/qt-cmake"
          chmod +x ./deploy/build_android.sh
          ./deploy/build_android.sh --debug --apk arm64-v8a --move --build-platform "${ANDROID_BUILD_PLATFORM}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: deploy/build/AmneziaVPN-arm64-v8a-debug.apk
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare file list
        run: find release-assets -type f -maxdepth 3 | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/windows-installer-exe/AmneziaVPN_windows_installer_x64.exe
            release-assets/windows-installer-msi/AmneziaVPN_windows_installer_x64.msi
            release-assets/windows-unpacked/AmneziaVPN_windows_unpacked.zip
            release-assets/android-arm64-debug/AmneziaVPN-arm64-v8a-debug.apk
